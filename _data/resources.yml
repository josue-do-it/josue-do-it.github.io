# -----------------------------------------------------------------------------
# Resources page (/resources/)
# -----------------------------------------------------------------------------
# To add a resource: copy an item block and fill the fields.
#   title    (required)  name of the book / course / paper / tool
#   url      (required)  link
#   author   (optional)  author(s) or organisation
#   note_en  (optional)  why you like it (English)
#   note_fr  (optional)  same in French (falls back to note_en)
#   image    (optional)  cover image, e.g. /assets/img/resources/deep-learning.jpg
#   tags     (optional)  list of keywords, used by the search box
#   free     (optional)  true -> shows a "Free" badge
#
# To add a whole new section: copy a section block (id, title_en, title_fr, icon, items).
# Icons: https://fontawesome.com/search?ic=free
# -----------------------------------------------------------------------------

- id: books
  title_en: Books
  title_fr: Livres
  icon: fa-solid fa-book
  items:
    - title: Deep Learning
      author: Ian Goodfellow, Yoshua Bengio, Aaron Courville
      url: https://www.deeplearningbook.org/
      note_en: The classic reference on the foundations of deep learning.
      note_fr: La référence classique sur les fondements du deep learning.
      tags: [deep learning, foundations]
      free: true
    - title: Mathematics for Machine Learning
      author: Marc P. Deisenroth, A. Aldo Faisal, Cheng Soon Ong
      url: https://mml-book.github.io/
      note_en: Linear algebra, calculus and probability, exactly as needed for ML.
      note_fr: Algèbre linéaire, calcul et probabilités, juste ce qu'il faut pour le ML.
      tags: [maths, foundations]
      free: true
    - title: "Probabilistic Machine Learning: An Introduction"
      author: Kevin P. Murphy
      url: https://probml.github.io/pml-book/book1.html
      note_en: A modern, probabilistic view of machine learning.
      note_fr: Une vision moderne et probabiliste de l'apprentissage automatique.
      tags: [probabilistic ml, bayesian]
      free: true
    - title: Pattern Recognition and Machine Learning
      author: Christopher M. Bishop
      url: https://www.microsoft.com/en-us/research/publication/pattern-recognition-machine-learning/
      tags: [probabilistic ml, bayesian]
      free: true
    - title: "Computer Vision: Algorithms and Applications"
      author: Richard Szeliski
      url: https://szeliski.org/Book/
      note_en: The go-to textbook for computer vision.
      note_fr: Le manuel de référence en vision par ordinateur.
      tags: [computer vision]
      free: true
    - title: Multiple View Geometry in Computer Vision
      author: Richard Hartley, Andrew Zisserman
      url: https://www.robots.ox.ac.uk/~vgg/hzbook/
      note_en: Camera models, epipolar geometry and 3D reconstruction.
      note_fr: Modèles de caméra, géométrie épipolaire et reconstruction 3D.
      tags: [3d vision, geometry, pose]
    - title: Dive into Deep Learning
      author: Aston Zhang, Zachary C. Lipton, Mu Li, Alexander J. Smola
      url: https://d2l.ai/
      tags: [deep learning, pytorch, hands-on]
      free: true

